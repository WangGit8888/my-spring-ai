server:
  port: 9999
spring:
  ai:
    openai:
      base-url: https://dashscope.aliyuncs.com/compatible-mode
      api-key: ${OPENAI_API_KEY}
      chat:
        options:
          model: qwen-max
          temperature: 0.8
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/test?autoReconnect=true&useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&useTimezone=true&serverTimezone=GMT%2B8&allowMultiQueries=true
    username: ${MYSQL_SERVICE_USER:root}
    password: ${MYSQL_SERVICE_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
  mybatis-plus:
    mapper-locations: classpath*:/mapper/**/*.xml
    type-aliases-package: com.example.myspringai.domain
    configuration:
      map-underscore-to-camel-case: true
      cache-enabled: false
      log-impl: org.apache.ibatis.logging.stdout.StdOutImpl  # 👈 开启 SQL 打印
  # RabbitMQ
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:admin}
    password: ${RABBITMQ_PASS:admin123}
    publisher-confirm-type: correlated  # 开启 publisher confirm，异步回调确保 broker 真正收到
    publisher-returns: true             # 开启 return 回调，感知消息路由失败(解决的是配置错误,而不是网络故障,一般不开)
    listener:
      simple:
        acknowledge-mode: manual  # 手动 ACK，各消费者通过自定义工厂的 RetryOperationsInterceptor 控制重试
        retry:
          enabled: false   # 重试由代码中的 RetryOperationsInterceptor 控制

  # Redis
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0



